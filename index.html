<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>habtracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0e0f11;
      --surface:  #16181c;
      --border:   #252830;
      --muted:    #3a3e4a;
      --text-dim: #6b7280;
      --text:     #d4d8e2;
      --text-hi:  #f0f2f7;
      --accent:   #A78BFA;
      --accent-2: #5ECFFF;
      --accent-3: #FFB86C;
      --danger:   #FF6B8A;
      --today-bg: rgba(167,139,250,0.07);
      --today-border: rgba(167,139,250,0.35);
      --radius:   10px;
      --col-w:    52px;
      --row-h:    52px;
    }

    html { font-size: 16px; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Geist', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 1000; opacity: .5;
    }

    .shell {
      width: 100%; max-width: 900px;
      padding: 32px 20px 80px;
      display: flex; flex-direction: column; gap: 32px;
    }

    /* HEADER */
    .header {
      display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
    }
    .wordmark {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(26px, 5vw, 38px);
      color: var(--text-hi);
      letter-spacing: -0.5px; line-height: 1;
    }
    .wordmark em { font-style: italic; color: var(--accent); }
    .sub {
      font-size: 12px; color: var(--text-dim);
      font-family: 'DM Mono', monospace;
      margin-top: 6px; letter-spacing: 0.04em;
    }

    /* WEEK NAV */
    .week-nav { display: flex; align-items: center; gap: 8px; }
    .nav-btn {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); cursor: pointer; border-radius: 8px;
      width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
      font-size: 16px; transition: all .15s;
    }
    .nav-btn:hover { border-color: var(--muted); color: var(--text-hi); }
    .nav-btn:disabled { opacity: .3; cursor: default; }
    .nav-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .today-btn {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text-dim); cursor: pointer; border-radius: 8px;
      padding: 0 12px; height: 36px; font-size: 11px;
      font-family: 'DM Mono', monospace; letter-spacing: 0.05em;
      transition: all .15s; white-space: nowrap;
    }
    .today-btn:hover { border-color: var(--accent); color: var(--accent); }
    .today-btn.hidden { visibility: hidden; pointer-events: none; }

    /* ADD ROW */
    .add-row { display: flex; gap: 8px; }
    .add-input {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 0 14px; height: 44px;
      color: var(--text-hi); font-size: 14px; font-family: 'Geist', sans-serif;
      outline: none; transition: border-color .15s;
    }
    .add-input::placeholder { color: var(--text-dim); }
    .add-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(167,139,250,.1); }
    .add-btn {
      background: var(--accent); border: none; border-radius: var(--radius);
      color: #1a0a2e; font-weight: 600; font-size: 14px;
      padding: 0 18px; height: 44px; cursor: pointer;
      font-family: 'Geist', sans-serif;
      transition: all .15s; white-space: nowrap;
    }
    .add-btn:hover { background: #c4b5fd; }
    .add-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* GRID */
    .grid-section {
      display: flex; flex-direction: column;
      border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
    }
    .grid-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .grid-inner { min-width: 560px; }
    .grid-header {
      display: grid;
      grid-template-columns: 1fr repeat(7, var(--col-w)) 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .gh-spacer { padding: 14px 16px; display: flex; align-items: center; }
    .week-label { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text-dim); letter-spacing: .05em; }
    .day-header {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 10px 4px; border-left: 1px solid var(--border); font-family: 'DM Mono', monospace;
    }
    .day-header.is-today { background: var(--today-bg); border-left: 1px solid var(--today-border); }
    .day-name { font-size: 9px; color: var(--text-dim); letter-spacing: .1em; text-transform: uppercase; font-weight: 500; }
    .day-num { font-size: 16px; font-weight: 500; color: var(--text); line-height: 1.2; margin-top: 2px; }
    .day-header.is-today .day-num { color: var(--accent); }
    .day-header.is-today .day-name { color: var(--accent); opacity: .7; }
    .streak-header {
      border-left: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; padding: 8px 4px;
    }
    .streak-header span { font-size: 9px; font-family: 'DM Mono', monospace; color: var(--text-dim); letter-spacing: .1em; text-transform: uppercase; }

    /* HABIT ROWS */
    .habit-row {
      display: grid;
      grid-template-columns: 1fr repeat(7, var(--col-w)) 56px;
      border-bottom: 1px solid var(--border); transition: background .1s;
    }
    .habit-row:last-child { border-bottom: none; }
    .habit-row:hover { background: rgba(255,255,255,.015); }
    .habit-name-cell {
      display: flex; align-items: center; gap: 8px;
      padding: 0 8px 0 16px; min-height: var(--row-h);
    }
    .habit-name-text {
      flex: 1; font-size: 14px; color: var(--text); font-weight: 400;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .habit-edit-input {
      flex: 1; background: transparent; border: none; border-bottom: 1px solid var(--accent);
      color: var(--text-hi); font-size: 14px; font-family: 'Geist', sans-serif;
      outline: none; padding: 2px 0;
    }
    .habit-actions { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
    .habit-row:hover .habit-actions,
    .habit-row:focus-within .habit-actions { opacity: 1; }
    .icon-btn {
      background: none; border: none; cursor: pointer;
      width: 28px; height: 28px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: var(--text-dim); transition: all .15s;
    }
    .icon-btn:hover { background: var(--border); color: var(--text-hi); }
    .icon-btn.danger:hover { background: rgba(255,107,138,.15); color: var(--danger); }
    .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    /* CHECK CELLS */
    .check-cell {
      border-left: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
    }
    .check-cell.is-today { background: var(--today-bg); border-left: 1px solid var(--today-border); }
    .check-cell.is-future { opacity: .35; }
    .check-btn {
      width: 30px; height: 30px; border-radius: 50%;
      border: 2px solid var(--muted); background: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all .18s cubic-bezier(.34,1.56,.64,1);
      position: relative; flex-shrink: 0; color: transparent;
    }
    .check-btn:hover:not(:disabled) { border-color: var(--accent); transform: scale(1.1); }
    .check-btn.checked { background: var(--accent); border-color: var(--accent); color: #1a0a2e; }
    .check-btn.checked::after {
      content: ''; position: absolute;
      width: 100%; height: 100%; border-radius: 50%;
      background: var(--accent);
      animation: pop .3s cubic-bezier(.34,1.56,.64,1); z-index: -1;
    }
    .check-btn:disabled { cursor: default; }
    .check-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .check-icon { width: 12px; height: 12px; }
    @keyframes pop {
      0% { transform: scale(1); opacity: .6; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    /* STREAK */
    .streak-cell {
      border-left: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
    }
    .streak-badge { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; color: var(--text-dim); min-width: 20px; text-align: center; }
    .streak-badge.hot { color: var(--accent-3); }
    .streak-badge.fire { color: var(--accent); }

    /* SUMMARY BAR */
    .summary-bar {
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .summary-stats { display: flex; gap: 20px; flex-wrap: wrap; }
    .stat { display: flex; align-items: baseline; gap: 6px; }
    .stat-val { font-family: 'DM Mono', monospace; font-size: 18px; font-weight: 500; color: var(--text-hi); }
    .stat-val.accent { color: var(--accent); }
    .stat-label { font-size: 11px; color: var(--text-dim); letter-spacing: .04em; }
    .progress-wrap { flex: 1; max-width: 200px; }
    .progress-track { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .4s cubic-bezier(.4,0,.2,1); }
    .progress-label { font-size: 10px; color: var(--text-dim); margin-top: 4px; font-family: 'DM Mono', monospace; }

    /* EMPTY STATE */
    .empty-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 72px 24px; gap: 16px; text-align: center;
    }
    .empty-icon {
      width: 64px; height: 64px; border-radius: 50%;
      background: var(--surface); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; margin-bottom: 4px;
    }
    .empty-title { font-family: 'Instrument Serif', serif; font-size: 24px; color: var(--text-hi); }
    .empty-body { font-size: 14px; color: var(--text-dim); max-width: 280px; line-height: 1.6; }
    .empty-hint { font-size: 12px; font-family: 'DM Mono', monospace; color: var(--muted); letter-spacing: .04em; margin-top: 4px; }

    /* ANIMATIONS */
    .habit-row-enter { animation: slideIn .25s ease forwards; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    .habit-row-exit { animation: slideOut .2s ease forwards; }
    @keyframes slideOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(-16px); } }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      :root { --col-w: 42px; --row-h: 48px; }
      .shell { padding: 20px 12px 60px; gap: 20px; }
      .header { flex-direction: column; align-items: flex-start; gap: 12px; }
      .summary-bar { flex-direction: column; align-items: flex-start; }
      .progress-wrap { max-width: 100%; width: 100%; }
    }
    @media (min-width: 1200px) {
      :root { --col-w: 60px; --row-h: 56px; }
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 3px; }
  </style>
</head>
<body>
  <div class="shell">

    <header class="header">
      <div class="header-left">
        <h1 class="wordmark">hab<em>tracker</em></h1>
        <p class="sub" id="weekLabel">—</p>
      </div>
      <nav class="week-nav">
        <button class="nav-btn" id="prevWeek">&#8592;</button>
        <button class="today-btn hidden" id="todayBtn">↩ this week</button>
        <button class="nav-btn" id="nextWeek">&#8594;</button>
      </nav>
    </header>

    <div class="add-row">
      <input class="add-input" id="habitInput" type="text" placeholder="New habit — e.g. Read 30 min, Exercise…" maxlength="60" autocomplete="off" />
      <button class="add-btn" id="addBtn">+ Add</button>
    </div>

    <section class="grid-section">
      <div class="grid-scroll">
        <div class="grid-inner">
          <div class="grid-header" id="gridHeader"></div>
          <div id="habitsList"></div>
        </div>
      </div>
      <div id="summaryBar" class="summary-bar" style="display:none"></div>
    </section>

  </div>
</body>
</html>
